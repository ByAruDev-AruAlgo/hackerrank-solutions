name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # Language folders
          languages = [
              "Python",
              "JavaScript",
              "HTML",
              "CSS",
              "SQL",
              "C++",
              "Java",
              "C",
              "C#",
              "Go",
              "Rust",
              "PHP",
              "Ruby"
          ]

          counts = {}

          # Each immediate subfolder = one solved problem
          for language in languages:
              path = Path(language)

              if path.exists() and path.is_dir():
                  counts[language] = sum(
                      1
                      for item in path.iterdir()
                      if item.is_dir() and not item.name.startswith(".")
                  )
              else:
                  counts[language] = 0

          total = sum(counts.values())

          # Build Progress section
          progress = "## Progress\n\n"

          for language in languages:
              if counts[language] > 0:
                  progress += f"- {language}: **{counts[language]}**\n"

          progress += f"- Total: **{total}**"

          # Read README
          readme_path = Path("README.md")
          readme = readme_path.read_text()

          # Replace Progress section
          readme = re.sub(
              r"## Progress.*?(?=\n## |\Z)",
              progress,
              readme,
              flags=re.S
          )

          # Active languages
          active_languages = [
              language
              for language in languages
              if counts[language] > 0
          ]

          language_text = (
              "Languages: " + " • ".join(active_languages)
              if active_languages
              else "Languages: None yet"
          )

          # Replace Languages line
          readme = re.sub(
              r"Languages:.*",
              language_text,
              readme
          )

          readme_path.write_text(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "chore: update solution stats"
          git push
